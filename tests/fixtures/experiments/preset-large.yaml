schema_version: 1
name: default-preset-large
target:
  kind: docker
  container: spark-cluster-master
  workspace: /home/sparker/HiBench
  spark_home: /usr/local/spark
  hadoop_home: /home/sparker/hadoop-3.3.6
  master: yarn
  deploy_mode: client
  hdfs_uri: hdfs://spark-cluster-master:9000
  workers:
  - spark-cluster-slave-1
  - spark-cluster-slave-2
  - spark-cluster-slave-3
mode: prepare_and_run
scale: large
repetitions: 1
timeout_s: 1800
resources:
  executor_instances: 2
  executor_cores: 2
  executor_memory: 2g
  driver_memory: 2g
  generation_partitions: 4
  shuffle_partitions: 4
  generation_shuffle_partitions: 4
spark_conf:
  spark.dynamicAllocation.enabled: false
  spark.sql.adaptive.enabled: false
  spark.eventLog.dir: hdfs://spark-cluster-master:9000/shared/spark-logs
  spark.yarn.historyServer.address: spark-cluster-master:18080
  spark.speculation: false
  spark.eventLog.enabled: true
workloads:
- id: micro.sleep
  parameters: {}
- id: micro.sort
  parameters: {}
- id: micro.terasort
  parameters: {}
- id: micro.wordcount
  parameters: {}
- id: micro.repartition
  parameters: {}
- id: sql.aggregation
  parameters: {}
- id: sql.join
  parameters: {}
- id: sql.scan
  parameters: {}
- id: websearch.pagerank
  parameters: {}
- id: ml.bayes
  parameters: {}
- id: ml.kmeans
  parameters: {}
- id: ml.lr
  parameters: {}
- id: ml.als
  parameters: {}
- id: ml.pca
  parameters: {}
- id: ml.gbt
  parameters: {}
- id: ml.rf
  parameters: {}
- id: ml.svd
  parameters: {}
- id: ml.linear
  parameters: {}
- id: ml.lda
  parameters: {}
- id: ml.svm
  parameters: {}
- id: ml.gmm
  parameters: {}
- id: ml.correlation
  parameters: {}
- id: ml.summarizer
  parameters: {}
- id: graph.nweight
  parameters: {}
