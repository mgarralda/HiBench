schema_version: 1
name: intermediate-representative-v1
target:
  kind: docker
  container: spark-cluster-master
  workspace: /home/sparker/HiBench
  spark_home: /usr/local/spark
  hadoop_home: /home/sparker/hadoop-3.3.6
  master: yarn
  deploy_mode: client
  hdfs_uri: hdfs://spark-cluster-master:9000
  workers:
  - spark-cluster-slave-1
  - spark-cluster-slave-2
  - spark-cluster-slave-3
mode: prepare_and_run
scale: tiny
repetitions: 4
timeout_s: 1800
resources:
  executor_instances: 2
  executor_cores: 2
  executor_memory: 2g
  driver_memory: 2g
  generation_partitions: 4
  shuffle_partitions: 4
  generation_shuffle_partitions: 4
spark_conf:
  spark.dynamicAllocation.enabled: false
  spark.sql.adaptive.enabled: false
  spark.eventLog.dir: hdfs://spark-cluster-master:9000/shared/spark-logs
  spark.yarn.historyServer.address: spark-cluster-master:18080
  spark.speculation: false
  spark.eventLog.enabled: true
workloads:
- id: micro.terasort
  parameters:
    datasize: 1000000
- id: sql.join
  parameters:
    pages: 5000
    uservisits: 50000
- id: ml.kmeans
  parameters:
    num_of_samples: 100000
    dimensions: 8
    num_of_clusters: 5
    max_iteration: 5
    seed: 1234
- id: ml.svd
  parameters:
    examples: 5000
    features: 64
    singularvalues: 16
    seed: 17
    computeU: false
- id: websearch.pagerank
  parameters:
    pages: 2000
    num_iterations: 3
    seed: 1
- id: graph.nweight
  parameters:
    edges: 200000
    degree: 3
    max_out_edges: 30
    seed: 42
