schema_version: 1
name: final-ml-and-pagerank-custom-parameters
target:
  kind: docker
  container: spark-cluster-master
  workspace: /home/sparker/HiBench
  spark_home: /usr/local/spark
  hadoop_home: /home/sparker/hadoop-3.3.6
  master: yarn
  deploy_mode: client
  hdfs_uri: hdfs://spark-cluster-master:9000
  workers:
  - spark-cluster-slave-1
  - spark-cluster-slave-2
  - spark-cluster-slave-3
mode: prepare_and_run
scale: tiny
repetitions: 1
timeout_s: 1800
resources:
  executor_instances: 1
  executor_cores: 1
  executor_memory: 2g
  driver_memory: 2g
  generation_partitions: 3
  shuffle_partitions: 3
  generation_shuffle_partitions: 3
spark_conf:
  spark.dynamicAllocation.enabled: false
  spark.sql.adaptive.enabled: false
  spark.eventLog.dir: hdfs://spark-cluster-master:9000/shared/spark-logs
  spark.yarn.historyServer.address: spark-cluster-master:18080
workloads:
- id: ml.bayes
  parameters:
    pages: 25000
    classes: 3
    document_seed: 17
    smoothing: 0.5
    split_seed: 23
    train_fraction: 0.7
- id: ml.svm
  parameters:
    examples: 1000
    features: 8
    seed: 17
    weight_seed: 23
    noise_std: 0.0
    numIterations: 20
    train_fraction: 0.7
    split_seed: 23
    fit_intercept: true
    tolerance: 1.0e-05
- id: ml.lda
  parameters:
    optimizer: em
    num_of_documents: 101
    num_of_vocabulary: 20
    num_of_topics: 3
    doc_len_min: 5
    doc_len_max: 20
    num_iterations: 3
    seed: 17
    model_seed: 7
- id: websearch.pagerank
  parameters:
    pages: 101
    seed: 17
    num_iterations: 3
