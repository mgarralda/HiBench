[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hibench-control"
version = "0.1.0"
description = "Reproducible batch experiments and Streamlit control for HiBench"
requires-python = ">=3.10"
dependencies = ["PyYAML>=6.0,<7"]

[project.optional-dependencies]
web = ["streamlit>=1.50,<2"]

[project.scripts]
hibench = "hibench.cli:main"

[tool.setuptools.packages.find]
include = ["hibench*"]

[tool.setuptools.package-data]
hibench = ["*.json"]
