# Enable event log
spark.eventLog.enabled                           true

# Directory to store event logs in Azure HDInsight
# Using HDFS:
#spark.eventLog.dir                               hdfs:///hdp/spark3-events
#spark.history.fs.logDirectory                    hdfs:///hdp/spark3-events

# Use Azure Blob Storage (wasbs) for event logs
#spark.eventLog.dir                                wasbs://hdp/spark3-events
# History Server reads logs from the same wasbs location
#spark.history.fs.logDirectory                     wasbs://hdp/spark3-events

# History Server Logs (docker version)
# spark.history.fs.logDirectory                   hdfs://spark-cluster-master:9000/shared/spark-logs
# spark.yarn.historyServer.address                spark-cluster-master:18080
spark.eventLog.dir                               hdfs://spark-cluster-master:9000/shared/spark-logs

#spark.executorEnv.SPARKBENCH_PROPERTIES_FILES /home/sshuser/HiBench/report/wordcount/spark/conf/sparkbench/sparkbench.conf
#spark.yarn.appMasterEnv.SPARKBENCH_PROPERTIES_FILES /home/sshuser/HiBench/report/wordcount/spark/conf/sparkbench/sparkbench.conf

# Initial execution settings for each data scale.
# Conservative baseline; these are not capacity or performance recommendations.
# Properties omitted from a section inherit the common settings above.

[tiny]
spark.executor.instances     3
spark.executor.cores   1
spark.executor.memory         1g
spark.driver.cores           1
spark.driver.memory          1g
spark.task.cpus              1
spark.sql.shuffle.partitions  200
spark.dynamicAllocation.enabled false
spark.sql.adaptive.enabled true
# Tiny baseline: bounded batches and one native numerical thread per process.
spark.yarn.appMasterEnv.OPENBLAS_NUM_THREADS 1
spark.yarn.appMasterEnv.OMP_NUM_THREADS 1
spark.executorEnv.OPENBLAS_NUM_THREADS 1
spark.executorEnv.OMP_NUM_THREADS 1
spark.sql.parquet.columnarReaderBatchSize 256
spark.sql.inMemoryColumnarStorage.batchSize 128
spark.sql.files.maxPartitionBytes 67108864

[small]
spark.executor.instances     2
spark.executor.cores   1
spark.executor.memory         2g
spark.driver.cores           4
spark.driver.memory          2g
spark.task.cpus              1
spark.sql.shuffle.partitions  200
spark.dynamicAllocation.enabled false
spark.sql.adaptive.enabled true
# Small baseline: one task per executor, bounded batches for wide dense vectors.
spark.yarn.appMasterEnv.OPENBLAS_NUM_THREADS 1
spark.yarn.appMasterEnv.OMP_NUM_THREADS 1
spark.executorEnv.OPENBLAS_NUM_THREADS 1
spark.executorEnv.OMP_NUM_THREADS 1
spark.sql.parquet.columnarReaderBatchSize 256
spark.sql.inMemoryColumnarStorage.batchSize 128
spark.sql.files.maxPartitionBytes 67108864

[large]
spark.executor.instances     2
spark.executor.cores   2
spark.executor.memory         2g
spark.driver.cores           4
spark.driver.memory          2g
spark.task.cpus              1
spark.sql.shuffle.partitions  200
spark.dynamicAllocation.enabled false
spark.sql.adaptive.enabled true
# Large baseline for the three-worker validation cluster.
# Client driver CPU capacity is enforced by the submission container (4 CPU).
# HiBench applies these driver thread variables to Client submission processes too.
spark.yarn.appMasterEnv.OPENBLAS_NUM_THREADS 4
spark.yarn.appMasterEnv.OMP_NUM_THREADS 4
spark.executorEnv.OPENBLAS_NUM_THREADS 1
spark.executorEnv.OMP_NUM_THREADS 1
# Bound columnar decode batches for wide dense feature vectors; data volume is unchanged.
spark.sql.parquet.columnarReaderBatchSize 256
spark.sql.inMemoryColumnarStorage.batchSize 128
spark.sql.files.maxPartitionBytes 67108864

