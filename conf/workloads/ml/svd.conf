# HiBench Next v2.5.0 recalibrated scales: see docs/workload-scales.md.
hibench.svd.tiny.examples                100
hibench.svd.tiny.features                100
hibench.svd.tiny.singularvalues          50
hibench.svd.tiny.maxresultsize           1g
hibench.svd.small.examples               50000
hibench.svd.small.features               1000
hibench.svd.small.singularvalues         100
hibench.svd.small.maxresultsize          1g
hibench.svd.large.examples               500000
hibench.svd.large.features               1000
hibench.svd.large.singularvalues         100
hibench.svd.large.maxresultsize          1g
hibench.svd.huge.examples                5000000
hibench.svd.huge.features                1000
hibench.svd.huge.singularvalues          100
hibench.svd.huge.maxresultsize           1g
hibench.svd.gigantic.examples            50000000
hibench.svd.gigantic.features            1000
hibench.svd.gigantic.singularvalues      100
hibench.svd.gigantic.maxresultsize       1g
hibench.svd.bigdata.examples             500000000
hibench.svd.bigdata.features             1000
hibench.svd.bigdata.singularvalues       100
hibench.svd.bigdata.maxresultsize        1g


hibench.svd.examples                     ${hibench.svd.${hibench.scale.profile}.examples}
hibench.svd.features                     ${hibench.svd.${hibench.scale.profile}.features}
hibench.svd.singularvalues               ${hibench.svd.${hibench.scale.profile}.singularvalues}
hibench.svd.maxresultsize                ${hibench.svd.${hibench.scale.profile}.maxresultsize}
hibench.svd.partitions                   ${hibench.generator.shuffle.partitions}

hibench.svd.computeU                     true

hibench.workload.input                   ${hibench.hdfs.data.dir}/SVD/normal-parquet-v1/Input/${hibench.scale.profile}
hibench.workload.output                  ${hibench.hdfs.data.dir}/SVD/Output/${hibench.scale.profile}

hibench.svd.seed 42
hibench.svd.rcond 0.000000001
hibench.svd.matrix_budget_bytes 2147483648
