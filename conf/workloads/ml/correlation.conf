# HiBench Next v2.5.0 recalibrated scales: see docs/workload-scales.md.
hibench.correlation.tiny.examples           100
hibench.correlation.tiny.features           100

hibench.correlation.small.examples          400000
hibench.correlation.small.features          1000

hibench.correlation.large.examples          4000000
hibench.correlation.large.features          1000

hibench.correlation.huge.examples           40000000
hibench.correlation.huge.features           1000

hibench.correlation.gigantic.examples       400000000
hibench.correlation.gigantic.features       1000

hibench.correlation.bigdata.examples        4000000000
hibench.correlation.bigdata.features        1000

hibench.correlation.corrType    pearson

hibench.correlation.examples                ${hibench.correlation.${hibench.scale.profile}.examples}
hibench.correlation.features                ${hibench.correlation.${hibench.scale.profile}.features}
hibench.correlation.partitions              ${hibench.generator.shuffle.partitions}

hibench.workload.input                 ${hibench.hdfs.data.dir}/Correlation/binary-gaussian-parquet-v1/Input/${hibench.scale.profile}
hibench.workload.output                ${hibench.hdfs.data.dir}/Correlation/Output/${hibench.scale.profile}

hibench.correlation.seed 42
hibench.correlation.class_shift 3.0
