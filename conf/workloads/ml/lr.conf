# HiBench Next v2.5.0 recalibrated scales: see docs/workload-scales.md.
hibench.lr.tiny.examples                        100
hibench.lr.tiny.features                        100
hibench.lr.small.examples                       400000
hibench.lr.small.features                       1000
hibench.lr.large.examples                       4000000
hibench.lr.large.features                       1000
hibench.lr.huge.examples                        40000000
hibench.lr.huge.features                        1000
hibench.lr.gigantic.examples                    400000000
hibench.lr.gigantic.features                    1000
hibench.lr.bigdata.examples                     4000000000
hibench.lr.bigdata.features                     1000


hibench.lr.examples                     ${hibench.lr.${hibench.scale.profile}.examples}
hibench.lr.features                     ${hibench.lr.${hibench.scale.profile}.features}
hibench.lr.partitions                   ${hibench.generator.shuffle.partitions}

hibench.workload.input                  ${hibench.hdfs.data.dir}/LR/logistic-parquet-v1/Input/${hibench.scale.profile}
hibench.workload.output                 ${hibench.hdfs.data.dir}/LR/Output/${hibench.scale.profile}

hibench.lr.seed 42
hibench.lr.class_shift 3.0
hibench.lr.num_iterations 100
hibench.lr.tolerance 1E-6
hibench.lr.regularization_param 0.0
hibench.lr.fit_intercept false
hibench.lr.standardization true
hibench.lr.train_fraction 0.6
hibench.lr.split_seed 11
hibench.lr.threshold 0.5
