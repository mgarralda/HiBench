# HiBench Next v2.5.0 recalibrated scales: see docs/workload-scales.md.
hibench.summarizer.tiny.examples           100
hibench.summarizer.tiny.features           100

hibench.summarizer.small.examples          400000
hibench.summarizer.small.features          1000

hibench.summarizer.large.examples          4000000
hibench.summarizer.large.features          1000

hibench.summarizer.huge.examples           40000000
hibench.summarizer.huge.features           1000

hibench.summarizer.gigantic.examples       400000000
hibench.summarizer.gigantic.features       1000

hibench.summarizer.bigdata.examples        4000000000
hibench.summarizer.bigdata.features        1000

hibench.summarizer.examples                ${hibench.summarizer.${hibench.scale.profile}.examples}
hibench.summarizer.features                ${hibench.summarizer.${hibench.scale.profile}.features}
hibench.summarizer.partitions              ${hibench.generator.shuffle.partitions}


hibench.workload.input                 ${hibench.hdfs.data.dir}/Summarizer/normal-parquet-v1/Input/${hibench.scale.profile}
hibench.workload.output                ${hibench.hdfs.data.dir}/Summarizer/Output/${hibench.scale.profile}

hibench.summarizer.seed 42
