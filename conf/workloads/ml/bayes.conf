# HiBench Next v2.5.0 recalibrated scales: see docs/workload-scales.md.
hibench.bayes.tiny.use_dense                false
hibench.bayes.tiny.dense.examples           100
hibench.bayes.tiny.dense.features           100
hibench.bayes.tiny.pages                    25000
hibench.bayes.tiny.classes                  10
hibench.bayes.tiny.ngrams                   1

hibench.bayes.small.use_dense               false
hibench.bayes.small.dense.examples          400000
hibench.bayes.small.dense.features          1000
hibench.bayes.small.pages                   30000
hibench.bayes.small.classes                 10
hibench.bayes.small.ngrams                  1

hibench.bayes.large.use_dense               false
hibench.bayes.large.dense.examples          4000000
hibench.bayes.large.dense.features          1000
hibench.bayes.large.pages                   300000
hibench.bayes.large.classes                 10
hibench.bayes.large.ngrams                  1

hibench.bayes.huge.use_dense                false
hibench.bayes.huge.dense.examples           40000000
hibench.bayes.huge.dense.features           1000
hibench.bayes.huge.pages                    3000000
hibench.bayes.huge.classes                  10
hibench.bayes.huge.ngrams                   1

hibench.bayes.gigantic.use_dense            false
hibench.bayes.gigantic.dense.examples       400000000
hibench.bayes.gigantic.dense.features       1000
hibench.bayes.gigantic.pages                30000000
hibench.bayes.gigantic.classes              10
hibench.bayes.gigantic.ngrams               1

hibench.bayes.bigdata.use_dense             false
hibench.bayes.bigdata.dense.examples        4000000000
hibench.bayes.bigdata.dense.features        1000
hibench.bayes.bigdata.pages                 300000000
hibench.bayes.bigdata.classes               10
hibench.bayes.bigdata.ngrams                1

hibench.bayes.use_dense                 ${hibench.bayes.${hibench.scale.profile}.use_dense}
hibench.bayes.dense.examples            ${hibench.bayes.${hibench.scale.profile}.dense.examples}
hibench.bayes.dense.features            ${hibench.bayes.${hibench.scale.profile}.dense.features}
hibench.bayes.pages                     ${hibench.bayes.${hibench.scale.profile}.pages}
hibench.bayes.classes                   ${hibench.bayes.${hibench.scale.profile}.classes}
hibench.bayes.ngrams                    ${hibench.bayes.${hibench.scale.profile}.ngrams}
hibench.bayes.base.hdfs                 ${hibench.hdfs.data.dir}/Bayes

hibench.workload.input                  ${hibench.hdfs.data.dir}/Bayes/features-parquet-v1/Input/${hibench.scale.profile}
hibench.workload.output                 ${hibench.hdfs.data.dir}/Bayes/Output/${hibench.scale.profile}
hibench.workload.pages                  ${hibench.bayes.pages}
hibench.workload.classes                ${hibench.bayes.classes}


hibench.bayes.dense_seed 1234
hibench.bayes.document_seed 1
hibench.bayes.class_shift 3.0
hibench.bayes.smoothing 1.0
hibench.bayes.train_fraction 0.8
hibench.bayes.split_seed 1234
