# HiBench Next v2.5.0 recalibrated scales: see docs/workload-scales.md.
hibench.gbt.tiny.examples               100
hibench.gbt.tiny.features               100
hibench.gbt.small.examples              400000
hibench.gbt.small.features              1000
hibench.gbt.large.examples              4000000
hibench.gbt.large.features              1000
hibench.gbt.huge.examples               40000000
hibench.gbt.huge.features               1000
hibench.gbt.gigantic.examples           400000000
hibench.gbt.gigantic.features           1000
hibench.gbt.bigdata.examples            4000000000
hibench.gbt.bigdata.features            1000


hibench.gbt.examples                    ${hibench.gbt.${hibench.scale.profile}.examples}
hibench.gbt.features                    ${hibench.gbt.${hibench.scale.profile}.features}
hibench.gbt.partitions                  ${hibench.generator.shuffle.partitions}

hibench.gbt.numClasses                  2
hibench.gbt.maxDepth                    30
hibench.gbt.maxBins                     32
hibench.gbt.numIterations               20
hibench.gbt.learningRate                0.1

hibench.workload.input                  ${hibench.hdfs.data.dir}/GBT/binary-gaussian-parquet-v1/Input/${hibench.scale.profile}
hibench.workload.output                 ${hibench.hdfs.data.dir}/GBT/Output/${hibench.scale.profile}

hibench.gbt.seed 42
hibench.gbt.class_shift 0.3
hibench.gbt.train_fraction 0.7
hibench.gbt.split_seed 11
hibench.gbt.model_seed 0
