# HiBench Next v2.5.0 recalibrated scales: see docs/workload-scales.md.
hibench.pca.tiny.examples               100
hibench.pca.tiny.features               100
hibench.pca.tiny.k                      10
hibench.pca.tiny.maxresultsize          1g

hibench.pca.small.examples              400000
hibench.pca.small.features              1000
hibench.pca.small.k                     10
hibench.pca.small.maxresultsize         1g

hibench.pca.large.examples              4000000
hibench.pca.large.features              1000
hibench.pca.large.k                     10
hibench.pca.large.maxresultsize         1g

hibench.pca.huge.examples               40000000
hibench.pca.huge.features               1000
hibench.pca.huge.k                      10
hibench.pca.huge.maxresultsize          1g

hibench.pca.gigantic.examples           400000000
hibench.pca.gigantic.features           1000
hibench.pca.gigantic.k                  10
hibench.pca.gigantic.maxresultsize      1g

hibench.pca.bigdata.examples            4000000000
hibench.pca.bigdata.features            1000
hibench.pca.bigdata.k                   10
hibench.pca.bigdata.maxresultsize       1g

hibench.pca.examples                    ${hibench.pca.${hibench.scale.profile}.examples}
hibench.pca.features                    ${hibench.pca.${hibench.scale.profile}.features}
hibench.pca.k                           ${hibench.pca.${hibench.scale.profile}.k}
hibench.pca.maxresultsize               ${hibench.pca.${hibench.scale.profile}.maxresultsize}
hibench.pca.partitions                  ${hibench.generator.shuffle.partitions}

hibench.workload.input                  ${hibench.hdfs.data.dir}/PCA/gaussian-parquet-v1/Input/${hibench.scale.profile}
hibench.workload.output                 ${hibench.hdfs.data.dir}/PCA/Output/${hibench.scale.profile}

hibench.pca.seed 42
