# HiBench Next v2.5.0 recalibrated scales: see docs/workload-scales.md.
hibench.linear.tiny.examples           100
hibench.linear.tiny.features           100

hibench.linear.small.examples          400000
hibench.linear.small.features          1000

hibench.linear.large.examples          4000000
hibench.linear.large.features          1000

hibench.linear.huge.examples           40000000
hibench.linear.huge.features           1000

hibench.linear.gigantic.examples       400000000
hibench.linear.gigantic.features       1000

hibench.linear.bigdata.examples        4000000000
hibench.linear.bigdata.features        1000

hibench.linear.examples                ${hibench.linear.${hibench.scale.profile}.examples}
hibench.linear.features                ${hibench.linear.${hibench.scale.profile}.features}
hibench.linear.partitions              ${hibench.generator.shuffle.partitions}

hibench.linear.regularization_param    0.3
hibench.linear.elasticnet_param        0.8
hibench.linear.num_iterations          50
hibench.linear.tolerance               1E-6

hibench.workload.input                 ${hibench.hdfs.data.dir}/Linear/linear-parquet-v1/Input/${hibench.scale.profile}
hibench.workload.output                ${hibench.hdfs.data.dir}/Linear/Output/${hibench.scale.profile}

hibench.linear.seed 42
hibench.linear.noise_std 1.0
hibench.linear.test_fraction 0.25
