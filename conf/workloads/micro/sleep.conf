# Sleep
# HiBench Next v2.5.0 recalibrated scales: see docs/workload-scales.md.
hibench.sleep.tiny.mapper.seconds 	    1
hibench.sleep.small.mapper.seconds 	    3
hibench.sleep.large.mapper.seconds 	    10
hibench.sleep.huge.mapper.seconds 	    30
hibench.sleep.gigantic.mapper.seconds 	60
hibench.sleep.bigdata.mapper.seconds 	  90

hibench.sleep.mapper.seconds		  ${hibench.sleep.${hibench.scale.profile}.mapper.seconds}

# export for shell script
hibench.workload.input			dummy
hibench.workload.output			dummy
